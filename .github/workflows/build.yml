name: build

on:
  push:
    branches:
      - '**'
      - '!images'
  pull_request:
    branches:
      - '**'
      - '!images'

env:
  # https://nodejs.org/en/download/current
  # https://nodejs.org/en/about/previous-releases
  node-version: 24.x

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gemfile:
          - gemfiles/Gemfile.rails-7.0
          - gemfiles/Gemfile.rails-7.1
          - gemfiles/Gemfile.rails-7.2
          - gemfiles/Gemfile.rails-8.0
          - gemfiles/Gemfile.rails-8.1
        include:
          # https://www.ruby-lang.org/en/downloads
          - gemfile: gemfiles/Gemfile.rails-7.0
            ruby-version: '3.2'
          - gemfile: gemfiles/Gemfile.rails-7.1
            ruby-version: '3.2'
          - gemfile: gemfiles/Gemfile.rails-7.2
            ruby-version: '3.3'
          - gemfile: gemfiles/Gemfile.rails-8.0
            ruby-version: '3.4'
          - gemfile: gemfiles/Gemfile.rails-8.1
            ruby-version: '4.0'
          - gemfile: Gemfile
            ruby-version: head
            allow_failures: 'true'

    env:
      RAILS_ENV: test
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.node-version }}
      - name: Prepare test application
        working-directory: ./spec/rails_app
        run: |
          bundle exec rails g chime_sdk:js
      - name: Run tests with RSpec
        run: bundle exec rspec
        continue-on-error: ${{ matrix.allow_failures == 'true' }}
      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        continue-on-error: true
        with:
          file: coverage/lcov.info
          format: lcov
          parallel: true
          flag-name: ${{ matrix.gemfile }}-${{ matrix.ruby-version }}
          fail-on-error: false

  aws-emulator:
    # Run the tests with integration tests against AWS Emulator (https://aws.amazon.com/products/developer-tools/emulator/)
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      AWS_EMULATOR: 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install AWS Emulator
        working-directory: ${{ runner.temp }}
        run: |
          PACKAGE_FILE=aws-emulator_amd64.deb
          curl -fsSLO https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/$PACKAGE_FILE
          curl -fsSLO https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/$PACKAGE_FILE.sig
          curl -fsSLo aws-publishing.asc https://downloads.aws.com/keys/gpg/current.asc
          gpg --import aws-publishing.asc
          # Verify the package with the documented fingerprint of the AWS publishing key
          gpg --with-colons --fingerprint ssm-publishing@amazon.com | grep -q '^fpr:::::::::98BCF336A3BE53B734E967C52E5BF49BD940F624:'
          gpg --verify $PACKAGE_FILE.sig $PACKAGE_FILE
          sudo apt-get install -y ./$PACKAGE_FILE
          aws-emulator -v
      - name: Start AWS Emulator
        run: |
          nohup aws-emulator > "$RUNNER_TEMP/aws-emulator.log" 2>&1 &
          EMULATOR_DIR="$HOME/.aws/emulator/9297"
          for i in $(seq 30); do
            curl -sf --cacert "$EMULATOR_DIR/ca.pem" https://127.0.0.1:9297/__admin/health && break
            sleep 1
          done
          curl -sf --cacert "$EMULATOR_DIR/ca.pem" https://127.0.0.1:9297/__admin/health
          {
            echo "AWS_ENDPOINT_URL=https://127.0.0.1:9297"
            echo "AWS_SHARED_CREDENTIALS_FILE=$EMULATOR_DIR/emulator_credentials"
            echo "AWS_CONFIG_FILE=$EMULATOR_DIR/config"
            echo "AWS_CA_BUNDLE=$EMULATOR_DIR/ca.pem"
            echo "AWS_EC2_METADATA_DISABLED=true"
            echo "AWS_REGION=us-east-1"
          } >> "$GITHUB_ENV"
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.node-version }}
      - name: Prepare test application
        working-directory: ./spec/rails_app
        run: |
          bundle exec rails g chime_sdk:js
      - name: Run tests with RSpec including integration tests with AWS Emulator
        run: bundle exec rspec

  coveralls:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Finish Coveralls parallel build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        continue-on-error: true
        with:
          parallel-finished: true
          fail-on-error: false
