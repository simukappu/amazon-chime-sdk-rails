name: build

on:
  push:
    branches:
      - '**'
      - '!images'
  pull_request:
    branches:
      - '**'
      - '!images'

env:
  # https://nodejs.org/en/download/current
  # https://nodejs.org/en/about/previous-releases
  node-version: 24.x

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gemfile:
          - gemfiles/Gemfile.rails-7.0
          - gemfiles/Gemfile.rails-7.1
          - gemfiles/Gemfile.rails-7.2
          - gemfiles/Gemfile.rails-8.0
          - gemfiles/Gemfile.rails-8.1
        include:
          # https://www.ruby-lang.org/en/downloads
          - gemfile: gemfiles/Gemfile.rails-7.0
            ruby-version: 3.2.9
          - gemfile: gemfiles/Gemfile.rails-7.1
            ruby-version: 3.2.9
          - gemfile: gemfiles/Gemfile.rails-7.2
            ruby-version: 3.3.10
          - gemfile: gemfiles/Gemfile.rails-8.0
            ruby-version: 3.4.8
          - gemfile: gemfiles/Gemfile.rails-8.1
            ruby-version: 4.0.0
          - gemfile: Gemfile
            ruby-version: head
            allow_failures: 'true'

    env:
      RAILS_ENV: test
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.node-version }}
      - name: Prepare test application
        working-directory: ./spec/rails_app
        run: |
          bundle exec rails g chime_sdk:js
      - name: Run tests with RSpec
        run: bundle exec rspec
        continue-on-error: ${{ matrix.allow_failures == 'true' }}
